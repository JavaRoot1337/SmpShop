# настройки магазина
shop:
  min-price: 1 # минимальная цена слота
  max-price: 2304 # максимальная цена слота
  max-per-player: 10 # обычный лимит магазинов
  plus-max-per-player: 50 # лимит с правом smpshop.plus
  menu-size: 36 # размер меню списка (36 или 54)
  allowed-menu-sizes:
    - 36
    - 54
  pending-placement-timeout-seconds: 60 # таймаут клика по сундуку (сек)

# база данных
storage:
  sqlite-file: shops.db # файл sqlite
  transaction-timeout-seconds: 10 # busy_timeout (сек)
  shutdown-timeout-seconds: 10 # ожидание закрытия при остановке (сек)

# звуки
sounds:
  seller-sale:
    enabled: true
    sound: entity.player.levelup
    volume: 1.0
    pitch: 0.9
  buyer-purchase:
    enabled: true
    sound: block.vault.insert_item_fail
    volume: 1.0
    pitch: 1.0

# уведомления в игре
notifications:
  offline-enabled: true # копить сумму продаж офлайн-продавцу
  join-message-enabled: true # показывать итог при входе

# интеграции
integrations:
  http:
    max-concurrent: 4
    connect-timeout-seconds: 10
    request-timeout-seconds: 15
    response-limit-bytes: 1048576
  telegram:
    enabled: false
    bot-token: "" # токен бота от BotFather
    poll-interval-seconds: 2
    poll-long-poll-seconds: 1
    link-code-timeout-seconds: 300
    api-base-url: "https://api.telegram.org/bot"
    referral-bot: true # выдавать ссылку вместо кода
    user-bot: "" # юзернейм бота без @
  discord:
    enabled: false
