name: SmpShop
version: '${version}'
main: ru.javaroot.SmpShop
api-version: '26.2'
folia-supported: true
description: магазины для спм
author: JavaRoot

commands:
  smpshop:
    description: управление магазинами игрока
    usage: /smpshop <help|set|balance|delete|remove|list|link|reload>
    aliases: [shop]
    permission: smpshop.use
    permission-message: '&cУ вас нет прав на эту команду'

permissions:
  smpshop.use:
    description: использование команды
    default: true
  smpshop.balance:
    description: просмотр баланса
    default: true
  smpshop.link:
    description: создание кода привязки
    default: true
  smpshop.plus:
    description: увеличенный лимит магазинов по подписке
    default: op
  smpshop.admin.remove:
    description: удаление магазина
    default: op
  smpshop.admin.list:
    description: просмотр магазинов другого игрока
    default: op
  smpshop.admin.reload:
    description: перезагрузка конфигурации и сообщений
    default: op
